<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">c
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Konversi Bilangan</title>
</head>
<body>
    <div class="div">
        <h1>Kalkulator Konversi Bilangan</h1>
    </div>  
    <div>
        <form action="">
            <input id="biner" type="radio" name="sistem_bilangan" value="biner" checked="checked">
            <label for="biner">Biner</label>
            <input id="oktal" type="radio" name="sistem_bilangan" value="oktal">
            <label for="oktal">Oktal</label>
            <input id="desimal" type="radio" name="sistem_bilangan" value="desimal">
            <label for="desimal">Desimal</label>
            <input id="heksadesimal" type="radio" name="sistem_bilangan" value="heksadesimal">
            <label for="heksadesimal">Heksa Desimal</label>
            <input id="bilangan" type="text">
        </form>
    </div>
    <div>
        <p id="hasil_biner">Biner: </p>
        <p id="hasil_oktal">Oktal: </p>
        <p id="hasil_desimal">Desimal: </p>
        <p id="hasil_heksa">Heksa Desimal: </p>
    </div>
    <script src="script.js"></script>
</body>
</html>
